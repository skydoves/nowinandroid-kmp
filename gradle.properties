# https://docs.gradle.org/current/userguide/build_environment.html#sec:configuring_jvm_memory
org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# KSP2 (the Room compiler) does not yet snapshot cleanly under the Gradle 9 configuration cache.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.binary.gc=cms
kotlin.native.binary.smallBinary=true
kotlin.incremental.native=true

# Compose Multiplatform
compose.resources.always.generate.accessors=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# navgraph 0.2.1 adds its KSP processor to the base `ksp` configuration, which KSP 2.3.10+
# rejects in Kotlin Multiplatform projects. This restores the previous behaviour (the base
# configuration feeds every target) until the plugin wires target-specific configurations.
ksp.allow.all.target.configuration=true
