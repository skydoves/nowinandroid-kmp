name: Preview Gallery

# Captures every @Preview on a real emulator with Compose HotSwan and publishes the generated
# catalog to GitHub Pages.
#
# HotSwan renders previews inside the running app process rather than in a headless renderer, so
# the captures include everything a device does: Compose Multiplatform string resources, the real
# theme, and artwork fetched over the network.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '**/composeResources/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-gallery
  cancel-in-progress: true

jobs:
  capture:
    name: Capture previews
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # Without KVM the x86_64 emulator falls back to software virtualisation and never finishes
      # booting inside the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      # Built outside the emulator step so the long Gradle build does not eat the emulator's
      # boot window. HotSwan instruments Compose call sites, so it is opt in and enabled only
      # for this job.
      - name: Build debug APK with HotSwan
        run: ./gradlew -Photswan.enabled=true :app:androidApp:assembleDebug --stacktrace

      # captureAllPreviews never prunes, so a deleted preview would otherwise linger forever.
      - name: Clear previous captures
        run: rm -rf .hotswan/preview-captures

      - name: Capture previews on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/androidApp/build/outputs/apk/debug/androidApp-debug.apk
            # The capture task refuses to run unless the app is already in the foreground: it
            # drives HotSwanPreviewActivity inside the live process.
            adb shell am start -n com.skydoves.nowinandroid.debug/com.skydoves.nowinandroid.MainActivity
            sleep 20
            ./gradlew -Photswan.enabled=true :app:androidApp:captureAllPreviews --stacktrace

      - name: Upload captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-gallery
          path: .hotswan/preview-captures/
          retention-days: 30

      # The task writes an index.html beside the PNGs, so the artifact is already a whole site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .hotswan/preview-captures/

  deploy:
    name: Deploy to GitHub Pages
    needs: capture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
